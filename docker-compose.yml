version: '3.8'

services:
  simply-fw-rules-manager:
    build: .
    container_name: simply_fw_rules_manager
    ports:
      - "3004:3000"
    environment:
      - DATABASE_URL=sqlite://data/simply_fw_rules_manager.db?mode=rwc
      - RUST_LOG=info
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/firewall:/etc/firewall:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
