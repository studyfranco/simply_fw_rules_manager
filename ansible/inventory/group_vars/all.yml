---
# ==============================================================================
# Global Configuration Variables for simply_* Ecosystem Deployment
# ==============================================================================

# Target Operating System defaults
target_debian_codename_fallback: "trixie"
known_debian_codenames:
  - "bookworm"
  - "bullseye"
  - "trixie"
  - "forky"
  - "sid"

# Essential Host Packages
common_packages:
  - "sudo"
  - "iptables"
  - "ipset"
  - "xtables-addons-common"
  - "xtables-addons-dkms"
  - "portsentry"
  - "ca-certificates"
  - "curl"
  - "wget"
  - "jq"
  - "cron"
  - "gnupg"
  - "rsync"
  - "pigz"
  - "openssl"

# Dedicated Unprivileged Hook Executor User
hookexecutor_user: "hookexecutor"
hookexecutor_group: "hookexecutor"
hookexecutor_home: "/home/hookexecutor"
hookexecutor_ssh_key_type: "ed25519"
hookexecutor_ssh_key_path: "{{ hookexecutor_home }}/.ssh/id_{{ hookexecutor_ssh_key_type }}"

# SSH Server Port (Auto-detected from sshd_config or overridden)
sshd_port: 22

# Docker Daemon Configuration (/etc/docker/daemon.json)
docker_daemon_config:
  experimental: true
  ipv6: true
  ip6tables: true
  live-restore: true
  bip: "10.125.0.1/16"
  fixed-cidr-v6: "fd10:1993:1000:1199::/112"
  default-address-pools:
    - base: "10.126.0.0/16"
      size: 28
    - base: "fd10:1993:1000:1200::/112"
      size: 124
  dns:
    - "1.1.1.1"
    - "8.8.8.8"

# Docker Bridge Networks Topology
docker_net_ext_name: "ext"
docker_net_ext_ipv4_subnet: "10.124.0.0/16"
docker_net_ext_ipv6_subnet: "fd10:1993:1000:1199::1:0/112"

docker_net_isolate_name: "isolate"
docker_net_isolate_ipv4_subnet: "10.123.0.0/16"
docker_net_isolate_ipv6_subnet: "fd10:1993:1000:1199::2:0/112"
docker_gateway_isolate_ip: "10.123.0.1"

# Firewall Directory & System Locations
firewall_dir: "/etc/firewall"
compose_dir: "{{ firewall_dir }}"
firewall_secrets_dir: "{{ firewall_dir }}/secrets"

# Source directory for core firewall scripts on controller (from git clone scripts_etc)
firewall_scripts_src_dir: "{{ playbook_dir }}/../../scripts_etc"

# Container User/Group Isolation
user_fw_rules_manager: "1128:1128"
user_hook_executor: "1127:1127"
user_ip_vault: "1124:1124"
user_ip_sync: "1126:1126"
user_ip_exporter: "1125:1125"

# SSH Exposure & Initial Bootstrap Firewall Policy
# Options for ssh_access_mode: "whitelist_only" | "country_restricted" | "worldwide"
ssh_access_mode: "whitelist_only"
country_open_port_default: "FR"
operator_whitelist_ips: []

# Container Logging Level ("info" on bootstrap extraction, "warn" for standard operation)
container_log_level: "warn"

# Service & Database Selection
# database_type options: "sqlite" | "postgres_container" | "postgres_external"
database_type: "sqlite"
postgres_version: "18"
postgres_container_name: "simply_postgres"
postgres_db_name: "simply_security"
postgres_user: "simply_admin"
postgres_password: "" # Set or auto-generated if postgres is selected
postgres_external_host: "10.123.0.1"
postgres_external_port: 5432

# simply_ip_vault Topology
# vault_mode options: "local" | "remote"
vault_mode: "local"
deploy_simply_ip_vault: true
vault_group_name: "Main_Ban"
vault_normalize_ipv6_to_48: true
remote_vault_url: "https://vault.example.com"
remote_vault_api_key: ""
remote_vault_signing_secret: ""

# Optional Ecosystem Components
deploy_simply_ip_sync: false
deploy_simply_ip_exporter: false

# AbuseIPDB Integration (Optional: leave abuseipdb_api_key empty to skip)
# - Configures AbuseIPDB Report webhook on simply_ip_vault for vault_group_name (IP_ADD,IP_UPDATE)
# - Configures abuseipdb JSON_PATH feed in simply_ip_sync (when deploy_simply_ip_sync is true)
abuseipdb_api_key: ""
abuseipdb_report_categories: "14,18"
abuseipdb_confidence_minimum: 90

# Default simply_ip_sync Destination Groups & Feeds (Replicated from Serv1 reference)
sync_default_destination_groups:
  - name: "Problematics IPS"
    target_group_name: "external_banlist"
    cron_schedule: "0 1 * * *"
    mode: "upsert"
    skip_bogon_filtering: false
    feeds:
      - name: "mass_scanner"
        source_url: "https://raw.githubusercontent.com/stamparm/maltrail/refs/heads/master/data/mass_scanner.txt"
        parser_type: "REGEX_LINE"
      - name: "voipbl"
        source_url: "https://www.voipbl.org/update/"
        parser_type: "REGEX_LINE"
      - name: "bitwire"
        source_url: "https://raw.githubusercontent.com/bitwire-it/ipblocklist/refs/heads/main/inbound.txt"
        parser_type: "REGEX_LINE"
      - name: "stopforumspam"
        source_url: "https://www.stopforumspam.com/downloads/bannedips.zip"
        parser_type: "REGEX_LINE"
      - name: "SFS_Toxic"
        source_url: "https://www.stopforumspam.com/downloads/toxic_ip_cidr.txt"
        parser_type: "REGEX_LINE"
      - name: "myip_blacklist"
        source_url: "https://myip.ms/files/blacklist/csf/latest_blacklist.txt"
        parser_type: "REGEX_LINE"
      - name: "emergin"
        source_url: "https://rules.emergingthreats.net/blockrules/compromised-ips.txt"
        parser_type: "REGEX_LINE"
      - name: "blocklistde"
        source_url: "https://lists.blocklist.de/lists/all.txt"
        parser_type: "REGEX_LINE"
      - name: "greensnow"
        source_url: "https://blocklist.greensnow.co/greensnow.txt"
        parser_type: "REGEX_LINE"
      - name: "DangerRulez"
        source_url: "https://danger.rulez.sk/projects/bruteforceblocker/blist.php"
        parser_type: "REGEX_LINE"
      - name: "cinsarmy"
        source_url: "https://cinsarmy.com/list/ci-badguys.txt"
        parser_type: "REGEX_LINE"
      - name: "spamhaus_v6"
        source_url: "https://www.spamhaus.org/drop/dropv6.txt"
        parser_type: "REGEX_LINE"
      - name: "spamhaus_v4"
        source_url: "https://www.spamhaus.org/drop/drop.txt"
        parser_type: "REGEX_LINE"
      - name: "emerginIps"
        source_url: "https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt"
        parser_type: "REGEX_LINE"

  - name: "VPN"
    target_group_name: "vpn"
    cron_schedule: "30 3 * * *"
    mode: "upsert"
    skip_bogon_filtering: false
    feeds:
      - name: "X4BNet_V4"
        source_url: "https://raw.githubusercontent.com/X4BNet/lists_vpn/refs/heads/main/output/vpn/ipv4.txt"
        parser_type: "REGEX_LINE"
      - name: "torlist"
        source_url: "https://www.dan.me.uk/torlist/?full"
        parser_type: "REGEX_LINE"
      - name: "X4BNet_V6"
        source_url: "https://raw.githubusercontent.com/X4BNet/lists_vpn/refs/heads/main/output/vpn/ipv6.txt"
        parser_type: "REGEX_LINE"
      - name: "NazgulCoder_V4"
        source_url: "https://raw.githubusercontent.com/NazgulCoder/IPLists/refs/heads/main/output/vpn-ipv4.txt"
        parser_type: "REGEX_LINE"
      - name: "NazgulCoder_V6"
        source_url: "https://raw.githubusercontent.com/NazgulCoder/IPLists/refs/heads/main/output/vpn-ipv6.txt"
        parser_type: "REGEX_LINE"

# Hook Executor Network Exposure
hook_executor_allow_ext_network: false

# Container Images
image_fw_rules_manager: "ghcr.io/studyfranco/simply_fw_rules_manager:master"
image_hook_executor: "ghcr.io/studyfranco/simply_hook_executor:master"
image_socket_proxy: "ghcr.io/wollomatic/socket-proxy:1"
image_fail2ban: "lscr.io/linuxserver/fail2ban:latest"
image_ip_vault: "ghcr.io/studyfranco/simply_ip_vault:master"
image_ip_sync: "ghcr.io/studyfranco/simply_ip_sync:master"
image_ip_exporter: "ghcr.io/studyfranco/simply_ip_exporter:master"

# Systemd Timers & Scheduled Automation
enable_blocklist_update_timer: true
blocklist_update_schedule: "*-*-* 03:00:00"

enable_daily_reload_timer: true
daily_reload_schedule: "*-*-* 04:00:00"

enable_container_update_timer: true
container_update_schedule: "Mon *-*-* 05:00:00"
