---
# ==============================================================================
# Master Deployment Playbook for simply_* Security Ecosystem
# Usage:
#   Interactive: ansible-playbook playbooks/site.yml
#   Headless/CI: ansible-playbook playbooks/site.yml -e "database_type=sqlite vault_mode=local"
# ==============================================================================
- name: Deploy and Configure simply_* Security Ecosystem
  hosts: security_nodes
  become: true
  gather_facts: true

  vars_prompt:
    - name: input_debian_codename
      prompt: "Debian version codename fallback [press Enter for 'trixie']"
      default: "trixie"
      private: false

    - name: input_database_type
      prompt: "Database type ('sqlite', 'postgres_container', 'postgres_external') [press Enter for 'sqlite']"
      default: "sqlite"
      private: false

    - name: input_postgres_version
      prompt: "PostgreSQL version if containerized [press Enter for '18']"
      default: "18"
      private: false

    - name: input_vault_mode
      prompt: "simply_ip_vault deployment ('local' or 'remote') [press Enter for 'local']"
      default: "local"
      private: false

    - name: input_remote_vault_url
      prompt: "Remote simply_ip_vault URL (if remote mode selected)"
      default: ""
      private: false

    - name: input_deploy_sync
      prompt: "Deploy simply_ip_sync threat feed aggregator? (yes/no) [press Enter for 'no']"
      default: "no"
      private: false

    - name: input_deploy_exporter
      prompt: "Deploy simply_ip_exporter raw list service? (yes/no) [press Enter for 'no']"
      default: "no"
      private: false

    - name: input_ssh_access_mode
      prompt: "SSH firewall access mode ('whitelist_only', 'country_restricted', 'worldwide') [press Enter for 'whitelist_only']"
      default: "whitelist_only"
      private: false

    - name: input_country_open_port
      prompt: "Allowed ISO countries for GeoIP filtering if country_restricted [press Enter for 'FR']"
      default: "FR"
      private: false

    - name: input_operator_whitelist_ips
      prompt: "Operator administration IPs to whitelist (comma-separated, e.g. 1.2.3.4,2001:db8::1) [leave empty if none]"
      default: ""
      private: false

    - name: input_abuseipdb_api_key
      prompt: "AbuseIPDB API Key for automated Vault reporting & Sync feed [leave empty to skip]"
      default: ""
      private: true

    - name: input_vault_normalize_ipv6_to_48
      prompt: "Normalize bare attacker IPv6 addresses to /48 inside simply_ip_vault? (yes/no) [press Enter for 'yes']"
      default: "yes"
      private: false

  pre_tasks:
    - name: Apply interactive prompts while preserving explicit CLI or inventory overrides
      ansible.builtin.set_fact:
        target_debian_codename_fallback: "{{ input_debian_codename if (input_debian_codename != 'trixie') else (target_debian_codename_fallback | default('trixie')) }}"
        database_type: "{{ input_database_type if (input_database_type != 'sqlite') else (database_type | default('sqlite')) }}"
        postgres_version: "{{ input_postgres_version if (input_postgres_version != '18') else (postgres_version | default('18')) }}"
        vault_mode: "{{ input_vault_mode if (input_vault_mode != 'local') else (vault_mode | default('local')) }}"
        remote_vault_url: "{{ input_remote_vault_url if (input_remote_vault_url | length > 0) else (remote_vault_url | default('')) }}"
        vault_normalize_ipv6_to_48: "{{ (input_vault_normalize_ipv6_to_48 | bool) if (input_vault_normalize_ipv6_to_48 != 'yes') else (vault_normalize_ipv6_to_48 | default(true) | bool) }}"
        deploy_simply_ip_sync: "{{ (input_deploy_sync | bool) if (input_deploy_sync != 'no') else (deploy_simply_ip_sync | default(false) | bool) }}"
        deploy_simply_ip_exporter: "{{ (input_deploy_exporter | bool) if (input_deploy_exporter != 'no') else (deploy_simply_ip_exporter | default(false) | bool) }}"
        ssh_access_mode: "{{ input_ssh_access_mode if (input_ssh_access_mode != 'whitelist_only') else (ssh_access_mode | default('whitelist_only')) }}"
        country_open_port_default: "{{ input_country_open_port if (input_country_open_port != 'FR') else (country_open_port_default | default('FR')) }}"
        abuseipdb_api_key: "{{ abuseipdb_api_key if (abuseipdb_api_key is defined and abuseipdb_api_key | length > 0) else input_abuseipdb_api_key }}"
        operator_whitelist_ips: >-
          {{
            operator_whitelist_ips
            if (operator_whitelist_ips is defined and operator_whitelist_ips | length > 0)
            else (input_operator_whitelist_ips.split(',') | map('trim') | reject('eq', '') | list if input_operator_whitelist_ips | length > 0 else [])
          }}

    - name: Compute early effective Vault URLs for container and host roles
      ansible.builtin.set_fact:
        effective_vault_container_url: "{{ 'http://simply_ip_vault:3000' if (vault_mode == 'local') else remote_vault_url }}"
        effective_vault_host_url: "{{ 'http://127.0.0.1:3000' if (vault_mode == 'local') else remote_vault_url }}"
        effective_vault_url: "{{ 'http://simply_ip_vault:3000' if (vault_mode == 'local') else remote_vault_url }}"

  roles:
    - role: common
      tags: [common, prereqs]

    - role: docker
      tags: [docker]

    - role: hookexecutor
      tags: [hookexecutor, ssh]

    - role: portsentry
      tags: [portsentry]

    - role: firewall
      tags: [firewall, systemd]

    - role: containers
      tags: [containers, compose]

    - role: vault_integration
      tags: [vault, integration]
